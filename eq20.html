<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐색 개념 10문항 + 코드 10문항 자동채점</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#18243b;font-family:'Malgun Gothic',Arial,sans-serif}header{position:sticky;top:0;background:#17346c;color:white;padding:14px 3%;z-index:2}h1{font-size:22px;margin:0 0 12px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border-radius:8px;padding:9px;border:1px solid #b8c7dd}button{cursor:pointer;background:#dceaff;color:#123a80}button.primary{background:#1758cb;color:white;border:0;font-weight:bold}main{max-width:1480px;margin:auto;padding:18px 3%}.card{background:white;border:1px solid #d8e0ec;border-radius:14px;padding:20px;margin:18px 0;scroll-margin-top:120px}h2{margin:0 0 16px;font-size:20px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.cols>div{min-width:0}pre{background:#122239;color:#dff0ff;padding:18px;border-radius:9px;white-space:pre;overflow:auto;font-size:14px;line-height:1.65}.option{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:8px 0;background:#f5f8fc;border:1px solid #dfe6ef;border-radius:8px;cursor:pointer}.option input{margin:4px 0;flex-shrink:0;accent-color:#1758cb}.feedback{display:none;margin-top:12px;padding:15px;border-radius:9px;background:#f2f6ff}.feedback.show{display:block}.good{color:#16703d}.bad{color:#b42318}.explain{padding-left:25px}.explain li{margin:9px 0;line-height:1.6}#summary{display:none}#summary.show{display:block}.sub{color:#52637c;line-height:1.7}.bar label{display:flex;gap:6px;align-items:center}.bar input{width:125px;color:#111}#nav{max-width:240px}footer{text-align:center;color:#64748b;padding:24px}@media(max-width:850px){.cols{grid-template-columns:1fr}header{position:static}.card{scroll-margin-top:12px}}@media print{header button,.checkbtn,#submit,#summary button{display:none}.cols{grid-template-columns:1fr 1fr}pre{white-space:pre-wrap;font-size:10px}.card{break-inside:avoid}}
.group-title{background:#e7efff;border-left:5px solid #2459bc;padding:16px;border-radius:9px;margin-top:24px}.meta{font-size:13px;color:#586985}.result-table{width:100%;border-collapse:collapse}.result-table th,.result-table td{border:1px solid #dce4f1;padding:8px;text-align:center}.result-table th{background:#e9f0fc}.feedback{background:#f0f6ff}.answer-correct{border-color:#16834b!important;background:#edfff4!important}.answer-wrong{border-color:#d43f3a!important;background:#fff0ef!important}#summary{scroll-margin-top:110px}</style></head><body><header><h1>🔎 탐색 알고리즘 개념·코드 평가 · 총 20문항</h1><div class="bar"><label>학번 <input id="studentId" placeholder="1100" inputmode="numeric"></label><label>이름 <input id="studentName" placeholder="이름"></label><select id="nav"></select><button onclick="window.print()">인쇄/PDF</button></div></header><main><p class="sub">개념 10문항(옳은 것 1개) + 파이썬 코드 10문항(옳은 것 2개) · 각 5점 · 총 100점. 제출하면 각 문항 정오답 및 5개 선택지 전체 해설이 나타나고 TXT 파일이 저장됩니다.</p><div id="questions"></div><section class="card" id="submit"><button class="primary" onclick="grade()">20문항 전체 채점 및 TXT 저장</button></section><section class="card" id="summary"><div id="result"></div><button onclick="saveTxt()">채점 TXT 다시 저장</button></section></main><footer>오프라인 학습자료 · Python 탐색 알고리즘</footer><script>const DATA=[{"title": "상태 공간", "stem": "탐색 문제에서 상태 공간(State Space)에 관한 설명으로 옳은 것은?", "opts": ["현재 방문한 정점 하나만 뜻한다.", "가능한 모든 상태의 집합을 뜻한다.", "반드시 2차원 격자로만 표현한다.", "정답 상태만 모은 집합이다.", "방문한 순서대로 저장된 출력 문자열이다."], "ans": [1], "exp": ["현재 상태는 상태 공간의 한 원소입니다.", "문제에서 도달 가능한 상태를 포괄하는 집합입니다.", "트리·그래프·문자열 등 다양한 구조가 가능합니다.", "정답이 아닌 상태도 포함됩니다.", "출력 순서와 상태 공간은 다릅니다."], "code": "", "kind": "concept"}, {"title": "초기 상태와 목표 상태", "stem": "초기 상태와 목표 상태에 관한 설명으로 옳은 것은?", "opts": ["초기 상태는 항상 목표 상태와 같다.", "목표 상태는 탐색 중 방문할 수 없다.", "초기 상태는 마지막으로 방문한 상태이다.", "목표 상태는 항상 하나만 존재한다.", "초기 상태는 탐색을 시작하는 상태이다."], "ans": [4], "exp": ["시작과 목표는 다를 수 있습니다.", "탐색은 목표 상태에 도달하는 것을 목적으로 합니다.", "초기 상태는 탐색 시작점입니다.", "문제에 따라 목표 상태가 여러 개일 수 있습니다.", "탐색을 시작할 때 주어진 상태입니다."], "code": "", "kind": "concept"}, {"title": "선형 탐색", "stem": "선형 탐색의 일반적인 특징으로 옳은 것은?", "opts": ["정렬되지 않은 리스트도 앞에서부터 검사할 수 있다.", "매 단계 탐색 구간을 정확히 절반으로 줄인다.", "항상 O(1) 시간에 탐색한다.", "반드시 재귀 호출이 필요하다.", "대상이 없더라도 첫 원소만 확인한다."], "ans": [0], "exp": ["선형 탐색은 정렬 여부와 관계없이 순서대로 검사할 수 있습니다.", "절반씩 줄이는 것은 이진 탐색의 특징입니다.", "최악 시간 복잡도는 O(n)입니다.", "반복문으로도 구현할 수 있습니다.", "대상이 없으면 모든 원소를 검사할 수 있습니다."], "code": "", "kind": "concept"}, {"title": "이진 탐색", "stem": "오름차순 리스트에서 이진 탐색에 관한 설명으로 옳은 것은?", "opts": ["중간값보다 작은 목표는 항상 오른쪽 구간에서 찾는다.", "정렬 여부는 결과에 영향을 주지 않는다.", "중간값을 비교해 탐색 구간을 줄인다.", "최악의 경우 모든 원소를 차례로 검사한다.", "중간 인덱스는 항상 리스트의 마지막 인덱스이다."], "ans": [2], "exp": ["작은 목표는 왼쪽 구간을 탐색합니다.", "정렬이 전제되어야 비교 결과로 구간을 제외할 수 있습니다.", "중간값을 기준으로 한쪽 구간을 버립니다.", "일반적인 시간 복잡도는 O(log n)입니다.", "중간 인덱스는 남은 구간의 중앙입니다."], "code": "", "kind": "concept"}, {"title": "DFS", "stem": "깊이 우선 탐색(DFS)에 대한 설명으로 옳은 것은?", "opts": ["반드시 큐만 사용한다.", "항상 간선 수가 최소인 경로를 먼저 찾는다.", "방문 순서는 인접 정점 순서와 무관하다.", "한 경로를 가능한 깊이 탐색한 뒤 되돌아간다.", "사이클이 있는 그래프에서도 방문 확인이 불필요하다."], "ans": [3], "exp": ["DFS는 스택 또는 재귀 호출을 이용할 수 있습니다.", "일반적인 DFS는 최단 경로를 보장하지 않습니다.", "인접 정점의 순서에 따라 방문 순서가 달라집니다.", "더 진행할 수 없으면 이전 분기로 돌아갑니다.", "사이클이 있으면 방문 여부 확인이 중요합니다."], "code": "", "kind": "concept"}, {"title": "BFS", "stem": "너비 우선 탐색(BFS)에 대한 설명으로 옳은 것은?", "opts": ["보통 스택의 LIFO를 이용한다.", "가중치 없는 그래프에서 간선 수 기준 최단 경로를 구할 수 있다.", "항상 DFS보다 메모리를 적게 사용한다.", "탐색 깊이를 무시하고 가장 먼 정점부터 방문한다.", "모든 간선의 가중치가 달라도 BFS가 가중치 합 최소 경로를 보장한다."], "ans": [1], "exp": ["BFS는 일반적으로 큐를 이용합니다.", "BFS는 가까운 거리의 정점부터 탐색하므로 최단 간선 수를 구합니다.", "메모리 사용량은 그래프 구조에 따라 다릅니다.", "시작점에서 가까운 정점부터 방문합니다.", "가중치가 다르면 다익스트라 등의 알고리즘을 고려해야 합니다."], "code": "", "kind": "concept"}, {"title": "스택과 큐", "stem": "스택과 큐의 자료 처리 순서에 대한 설명으로 옳은 것은?", "opts": ["스택과 큐는 모두 FIFO이다.", "스택은 FIFO이고 큐는 LIFO이다.", "큐에서 pop()은 항상 앞쪽 원소를 제거한다.", "스택은 데이터를 꺼낼 수 없다.", "스택은 LIFO, 큐는 FIFO 구조이다."], "ans": [4], "exp": ["스택은 후입선출입니다.", "순서가 반대입니다.", "파이썬 deque에서는 popleft()로 앞쪽을 제거합니다.", "스택은 push/pop 동작이 있습니다.", "스택은 나중에 넣은 것을 먼저, 큐는 먼저 넣은 것을 먼저 꺼냅니다."], "code": "", "kind": "concept"}, {"title": "완전탐색", "stem": "완전탐색(Brute Force)에 대한 설명으로 옳은 것은?", "opts": ["가능한 후보를 체계적으로 모두 검사하는 방법이다.", "모든 문제에서 가장 빠른 알고리즘이다.", "탐색할 후보가 늘어도 실행 시간은 변하지 않는다.", "반드시 이진 탐색을 사용한다.", "목표 상태를 미리 알아야만 탐색할 수 있다."], "ans": [0], "exp": ["모든 가능한 후보를 확인하여 답을 찾습니다.", "경우의 수가 많으면 비효율적일 수 있습니다.", "후보 수가 커지면 탐색량도 증가할 수 있습니다.", "반복·재귀 등 다양한 방식으로 구현합니다.", "목표 조건만으로도 탐색할 수 있습니다."], "code": "", "kind": "concept"}, {"title": "백트래킹", "stem": "백트래킹(Backtracking)에 대한 설명으로 옳은 것은?", "opts": ["한 번 선택한 값은 절대로 제거하지 않는다.", "반드시 큐의 popleft()를 사용한다.", "선택을 시도하고 되돌아와 다른 선택을 탐색한다.", "모든 상태를 메모리에 저장해야 한다.", "재귀 함수에서는 사용할 수 없다."], "ans": [2], "exp": ["상태를 복원하는 과정이 핵심입니다.", "백트래킹은 큐 사용이 필수는 아닙니다.", "선택·재귀·복원을 반복해 다른 후보를 확인합니다.", "모든 상태 저장은 필수가 아닙니다.", "재귀 함수로 자주 구현합니다."], "code": "", "kind": "concept"}, {"title": "가지치기", "stem": "가지치기(Pruning)에 대한 설명으로 옳은 것은?", "opts": ["정답이 가능한 경로를 무조건 모두 제거한다.", "탐색의 정확성을 유지할 조건 검사는 필요 없다.", "모든 문제에서 total > target이면 안전하다.", "해가 될 수 없다고 판단한 분기의 탐색을 중단한다.", "가지치기를 하면 반드시 모든 경우를 끝까지 방문한다."], "ans": [3], "exp": ["유효한 정답을 제거하면 안 됩니다.", "올바른 조건을 사용해야 정답을 놓치지 않습니다.", "음수가 포함된 합 문제에서는 초과 합이 나중에 줄어들 수 있습니다.", "불가능한 경로를 조기에 제외해 탐색량을 줄입니다.", "불필요한 분기는 더 이상 방문하지 않습니다."], "code": "", "kind": "concept"}, {"title": "선형 탐색", "code": "a = [7, 2, 9, 4, 6]\ntarget = 4\nfor i, x in enumerate(a):\n    if x == target:\n        print(i)\n        break", "opts": ["출력값은 3이다.", "출력값은 4이다.", "리스트는 반드시 정렬되어 있어야 한다.", "최악의 경우 비교 횟수는 리스트 길이에 비례한다.", "enumerate(a)는 값만 반환한다."], "ans": [0, 3], "exp": ["4는 인덱스 3에 있으므로 3을 출력합니다.", "4는 값이며 인덱스는 3입니다.", "선형 탐색은 정렬을 요구하지 않습니다.", "마지막 원소까지 검사할 수 있어 O(n)입니다.", "enumerate는 (인덱스, 값)을 제공합니다."], "kind": "code", "stem": "다음 파이썬 코드에 대한 설명으로 옳은 것 2개를 고르시오."}, {"title": "이진 탐색", "code": "a = [2, 5, 8, 12, 16, 23, 38]\ntarget = 16\nleft, right = 0, len(a)-1\nwhile left <= right:\n    mid = (left + right)//2\n    if a[mid] == target:\n        print(mid)\n        break\n    elif a[mid] < target:\n        left = mid + 1\n    else:\n        right = mid - 1", "opts": ["첫 번째 mid는 0이다.", "첫 번째 비교값은 12이다.", "정렬되지 않은 리스트에서도 항상 정확하다.", "출력값은 5이다.", "탐색 범위가 대체로 절반씩 줄어든다."], "ans": [1, 4], "exp": ["첫 mid는 (0+6)//2=3입니다.", "a[3]=12입니다.", "이진 탐색은 정렬 상태를 전제로 합니다.", "16의 인덱스는 4입니다.", "비교 후 한쪽 절반을 제외합니다."], "kind": "code", "stem": "다음 파이썬 코드에 대한 설명으로 옳은 것 2개를 고르시오."}, {"title": "재귀 이진 탐색", "code": "def search(a, x, l, r):\n    if l > r:\n        return -1\n    m = (l+r)//2\n    if a[m] == x:\n        return m\n    if x < a[m]:\n        return search(a,x,l,m-1)\n    return search(a,x,m+1,r)\nprint(search([1,3,5,7,9], 6, 0, 4))", "opts": ["출력값은 -1이다.", "출력값은 2이다.", "l > r은 탐색 실패 종료 조건이다.", "재귀 호출마다 리스트가 반드시 복사된다.", "탐색 대상이 없으면 무한 재귀한다."], "ans": [0, 2], "exp": ["6은 없으므로 -1을 반환합니다.", "인덱스 2의 값은 5입니다.", "검색 구간이 비면 실패를 반환합니다.", "같은 리스트와 인덱스 범위를 전달합니다.", "l > r에서 재귀가 끝납니다."], "kind": "code", "stem": "다음 파이썬 코드에 대한 설명으로 옳은 것 2개를 고르시오."}, {"title": "재귀 DFS", "code": "g = {'A':['B','C'],'B':['D'],'C':[],'D':[]}\nseen = set()\ndef dfs(v):\n    seen.add(v)\n    print(v, end=' ')\n    for w in g[v]:\n        if w not in seen:\n            dfs(w)\ndfs('A')", "opts": ["출력 순서는 A C B D이다.", "큐의 FIFO 원리를 사용한다.", "D는 B보다 먼저 출력된다.", "출력 순서는 A B D C이다.", "seen은 중복 방문을 막는다."], "ans": [3, 4], "exp": ["인접 리스트 순서대로 B를 먼저 방문합니다.", "재귀 호출 스택을 이용합니다.", "B가 먼저 출력된 뒤 D로 이동합니다.", "A→B→D→C 순서입니다.", "방문 집합은 사이클에서 재방문을 방지합니다."], "kind": "code", "stem": "다음 파이썬 코드에 대한 설명으로 옳은 것 2개를 고르시오."}, {"title": "큐 BFS", "code": "from collections import deque\ng = {0:[1,2],1:[3],2:[4],3:[],4:[]}\nq = deque([0])\nseen = {0}\nwhile q:\n    v = q.popleft()\n    print(v, end=' ')\n    for w in g[v]:\n        if w not in seen:\n            seen.add(w)\n            q.append(w)", "opts": ["출력 순서는 0 1 3 2 4이다.", "출력 순서는 0 1 2 3 4이다.", "popleft()는 큐의 앞 원소를 꺼낸다.", "BFS는 항상 재귀로만 구현한다.", "seen은 출력 후에만 갱신해야 한다."], "ans": [1, 2], "exp": ["3보다 2가 먼저 큐에서 나옵니다.", "깊이 1의 1,2 다음 깊이 2의 3,4를 방문합니다.", "deque.popleft는 FIFO 동작입니다 const $=id=>document.getElementById(id),sym=['①','②','③','④','⑤'];
let finished=false,report='',filename='',submittedAt='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function chosen(i){return [...document.querySelectorAll('input[name="q'+i+'"]:checked')].map(e=>+e.value).sort((a,b)=>a-b)}
function render(){let root=$('questions');root.innerHTML='';DATA.forEach((q,i)=>{if(i===0||i===10){let h=document.createElement('h2');h.className='group-title';h.textContent=i===0?'Ⅰ. 탐색 개념 평가 · 1~10번 (정답 1개)':'Ⅱ. 파이썬 코드 분석 · 11~20번 (정답 2개)';root.appendChild(h)}let s=document.createElement('section');s.className='card';s.id='q'+i;s.innerHTML='<h2>'+(i+1)+'. '+esc(q.title)+' <span class="meta">(5점 · '+(q.ans.length===1?'정답 1개':'정답 2개')+')</span></h2><p><b>'+esc(q.stem)+'</b></p>'+(q.code?'<div class="cols"><div><b>파이썬 전체 코드</b><pre>'+esc(q.code)+'</pre></div><div class="choices"></div></div>':'<div class="choices"></div>')+'<div class="feedback" id="f'+i+'"></div>';let c=s.querySelector('.choices');c.innerHTML=q.opts.map((v,j)=>'<label class="option" id="o'+i+'_'+j+'"><input type="'+(q.ans.length===1?'radio':'checkbox')+'" name="q'+i+'" value="'+j+'" '+(q.ans.length===2?'onchange="limit('+i+',this)"':'')+'><span>'+sym[j]+' '+esc(v)+'</span></label>').join('');root.appendChild(s)});$('nav').innerHTML='<option value="">문항 이동</option>'+DATA.map((q,i)=>'<option value="q'+i+'">'+(i+1)+'번 '+esc(q.title)+'</option>').join('')}
function limit(i,el){if(chosen(i).length>2){el.checked=false;alert('이 문항은 정확히 2개를 선택해야 합니다.')}}
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
function explain(i){let q=DATA[i],a=chosen(i),ok=same(a,q.ans),f=$('f'+i);f.innerHTML='<h3 class="'+(ok?'good':'bad')+'">'+(ok?'정답':'오답')+' · '+(ok?5:0)+'점</h3><p>학생 응답: '+(a.length?a.map(j=>sym[j]).join(', '):'미응답')+' / 정답: '+q.ans.map(j=>sym[j]).join(', ')+'</p><b>모든 선택지 상세 해설</b><ol class="explain">'+q.exp.map((e,j)=>'<li><b>'+sym[j]+' '+(q.ans.includes(j)?'옳음':'틀림')+'</b> — '+esc(e)+'</li>').join('')+'</ol>';f.classList.add('show');q.opts.forEach((_,j)=>{$('o'+i+'_'+j).classList.add(q.ans.includes(j)?'answer-correct':a.includes(j)?'answer-wrong':'')});return ok}
function grade(){if(finished){saveTxt();return}let id=$('studentId').value.trim(),name=$('studentName').value.trim();if(!/^\d+$/.test(id)||!name){alert('학번(숫자)과 이름을 입력하세요.');return}let missing=DATA.findIndex((q,i)=>chosen(i).length!==q.ans.length);if(missing>=0){alert((missing+1)+'번 문항에서 옳은 것 '+DATA[missing].ans.length+'개를 선택하세요.');$('q'+missing).scrollIntoView();return}let now=new Date(),pad=n=>String(n).padStart(2,'0'),time=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;submittedAt=now.toLocaleString('ko-KR');let score=0,lines=['탐색 알고리즘 개념·코드 평가 20문항','학번: '+id,'이름: '+name,'응시시각: '+submittedAt];let rows=[];DATA.forEach((q,i)=>{let a=chosen(i),ok=explain(i);if(ok)score+=5;rows.push('<tr><td>'+(i+1)+'</td><td>'+esc(q.title)+'</td><td>'+a.map(j=>sym[j]).join(', ')+'</td><td>'+q.ans.map(j=>sym[j]).join(', ')+'</td><td class="'+(ok?'good':'bad')+'">'+(ok?'정답':'오답')+'</td><td>'+(ok?5:0)+'</td></tr>');lines.push('','['+(i+1)+'번] '+q.title,'문제: '+q.stem,'유형: '+(q.kind==='concept'?'개념':'코드 분석'),'결과: '+(ok?'정답':'오답')+' ('+(ok?5:0)+'점)','학생 응답: '+a.map(j=>sym[j]).join(', '),'정답: '+q.ans.map(j=>sym[j]).join(', '));if(q.code)lines.push('[파이썬 코드]',q.code);lines.push('[선택지 및 상세 해설]');q.opts.forEach((v,j)=>lines.push(sym[j]+' '+v,'  '+(q.ans.includes(j)?'옳음':'틀림')+': '+q.exp[j]))});lines.splice(4,0,'총점: '+score+' / 100점');report=lines.join('\r\n');filename=`${id}_${name.replace(/[\\/:*?"<>|]/g,'_')}_${score}_탐색_${time}.txt`;$('result').innerHTML='<h2>'+esc(name)+' · '+score+' / 100점</h2><p>정답 '+score/5+'문항 · 오답 '+(20-score/5)+'문항</p><table class="result-table"><thead><tr><th>번호</th><th>주제</th><th>응답</th><th>정답</th><th>결과</th><th>점수</th></tr></thead><tbody>'+rows.join('')+'</tbody></table><p>각 문항 아래에 정오답 및 선택지별 상세 해설이 표시되었습니다.</p>';$('summary').classList.add('show');finished=true;document.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(e=>e.disabled=true);saveTxt();$('summary').scrollIntoView()}
function saveTxt(){if(!report)return;let b=new Blob(['\ufeff'+report],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.addEventListener('DOMContentLoaded',()=>{render();$('nav').onchange=e=>{if(e.target.value)$(e.target.value).scrollIntoView({behavior:'smooth'})}});
</script></body></html>
